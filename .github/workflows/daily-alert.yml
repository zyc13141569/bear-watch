name: 每日静默告警检查

# 周一至周五美股收盘后跑一次。平时完全不发消息，
# 只有 config.yaml 里的高阈值规则被触发才推送。
on:
  schedule:
    # 22:15 UTC = 多伦多夏令时 18:15（收盘后约 2 小时）
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印不发送"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bear-watch-write
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 静默检查
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          REPORT_URL: https://github.com/${{ github.repository }}/blob/main/REPORT.md
        run: python run_alert.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 提交每日记录
        run: |
          git config user.name  "bear-watch[bot]"
          git config user.email "bear-watch@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "🔍 daily check $(date -u +%Y-%m-%d)"
            git push
          fi
