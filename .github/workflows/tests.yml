name: 自测

on:
  push:
    paths:
      - "bearwatch/**"
      - "tests/**"
      - "config.yaml"
      - "run_*.py"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 离线自测（不需要网络和密钥）
        run: python tests/test_offline.py
      - name: 检查权重之和
        run: |
          python - <<'PY'
          import yaml
          w = yaml.safe_load(open("config.yaml", encoding="utf-8"))["weights"]
          s = sum(w.values())
          assert abs(s - 100) < 1e-9, f"weights 之和 = {s}，必须等于 100"
          print("✅ weights 之和 = 100")
          PY
