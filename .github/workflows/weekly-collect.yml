name: 周日采集 (collect + DeepSeek)

on:
  schedule:
    # 21:30 UTC 周日 = 多伦多夏令时 17:30 / 冬令时 16:30
    - cron: "30 21 * * 0"
  workflow_dispatch:
    inputs:
      send_now:
        description: "采集完立即发 Telegram（不等 Claude 的 CC 段）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bear-watch-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 采集 + 打分 + DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          REPORT_URL: https://github.com/${{ github.repository }}/blob/main/REPORT.md
        run: |
          python run_collect.py ${{ inputs.send_now && '--send-now' || '' }}

      - name: 提交结果
        run: |
          git config user.name  "bear-watch[bot]"
          git config user.email "bear-watch@users.noreply.github.com"
          git add -A REPORT.md ds_brief.md data/
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "📊 weekly: $(date -u +%Y-%m-%d) data collected"
            git push
          fi

      - name: 汇总到 Actions 摘要
        if: always()
        run: python tools/summary.py latest.json
